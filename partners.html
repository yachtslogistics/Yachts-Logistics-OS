<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Yacht Logistics OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">⚓</div>
      <div>
        <div class="name">Yacht Logistics OS</div>
        <div class="sub">Muscat · Oman</div>
      </div>
    </div>

    <h1>Sign in</h1>
    <p class="lead">Private workspace — access is restricted to authorized team members.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <div class="error-text" id="login-error"></div>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
    </form>

    <div class="login-foot">Every action inside this system is recorded in the activity log.</div>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  // If already signed in, skip straight to the dashboard.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = 'dashboard.html';

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.textContent = '';
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = 'Incorrect email or password.';
      btn.textContent = 'Sign in';
      btn.disabled = false;
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
