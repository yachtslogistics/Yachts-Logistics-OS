<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console — Yacht Logistics OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">⚓</div>
      <div>
        <div class="name">Yacht Logistics</div>
        <div class="sub">Operating System</div>
      </div>
    </div>
    <ul class="nav-list">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="prospects.html">Prospects</a></li>
      <li><a href="pipeline.html">Pipeline</a></li>
      <li><a href="console.html" class="active">Console</a></li>
      <li><a href="settings.html">Settings</a></li>
      <li><a href="activity.html">Activity Log</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-email" data-user-email>—</div>
      <button class="btn-signout" data-signout>Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1>Console</h1>
      <p><span class="live-dot"></span>Live view of what your AI workers are actually doing. Click a row for details.</p>
    </div>

    <div class="panel">
      <div class="console-toolbar">
        <select id="worker-filter" class="console-filter">
          <option value="all">All workers</option>
        </select>
        <span style="color: var(--text-faint); font-size: 11.5px;" id="console-updated"></span>
      </div>

      <div id="console-feed">
        <div class="log-row">Loading…</div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, requireAuth, wireSignOut, timeAgo } from './js/supabaseClient.js';

  await requireAuth();
  wireSignOut();

  const filterSelect = document.getElementById('worker-filter');
  const feed = document.getElementById('console-feed');
  const updatedLabel = document.getElementById('console-updated');

  let knownWorkers = new Set();

  function classify(action) {
    const a = (action || '').toLowerCase();
    if (a.includes('failed') || a.includes('error')) return 'status-fail';
    if (a.includes('aborted') || a.includes('skipped')) return 'status-warn';
    if (a.includes('complete') || a.includes('added') || a.includes('updated') || a.includes('moved') || a.includes('deleted')) return 'status-ok';
    return '';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  async function loadConsole() {
    const selected = filterSelect.value;

    let query = supabase.from('activity_log').select('*').order('created_at', { ascending: false }).limit(150);
    if (selected !== 'all') query = query.eq('worker_name', selected);

    const { data, error } = await query;

    if (error) {
      feed.innerHTML = `<div class="log-row">Error loading console: ${error.message}</div>`;
      return;
    }

    // Rebuild the worker filter list from whatever's actually in the log,
    // without resetting the user's current selection.
    (data || []).forEach(l => { if (l.worker_name) knownWorkers.add(l.worker_name); });
    const currentValue = filterSelect.value;
    filterSelect.innerHTML = '<option value="all">All workers</option>' +
      [...knownWorkers].sort().map(w => `<option value="${escapeHtml(w)}">${escapeHtml(w)}</option>`).join('');
    filterSelect.value = currentValue;

    if (!data || data.length === 0) {
      feed.innerHTML = '<div class="log-row">Nothing logged yet for this filter.</div>';
    } else {
      feed.innerHTML = data.map((l, i) => `
        <div class="console-row ${classify(l.action)}" data-idx="${i}">
          <div class="console-row-head">
            <span class="c-time">${timeAgo(l.created_at)}</span>
            <span class="c-worker">${escapeHtml(l.worker_name || '—')}</span>
            <span class="c-action">${escapeHtml(l.action || '')}</span>
          </div>
          <div class="console-detail">${escapeHtml(JSON.stringify(l.detail || {}, null, 2))}</div>
        </div>
      `).join('');

      feed.querySelectorAll('.console-row').forEach(row => {
        row.addEventListener('click', () => row.classList.toggle('expanded'));
      });
    }

    updatedLabel.textContent = 'Updated ' + timeAgo(new Date().toISOString());
  }

  filterSelect.addEventListener('change', loadConsole);

  await loadConsole();
  setInterval(loadConsole, 15000);
</script>

</body>
</html>
