<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Yacht Logistics OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">⚓</div>
      <div>
        <div class="name">Yacht Logistics</div>
        <div class="sub">Operating System</div>
      </div>
    </div>
    <ul class="nav-list">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="prospects.html">Prospects</a></li>
      <li><a href="pipeline.html">Pipeline</a></li>
      <li><a href="console.html">Console</a></li>
      <li><a href="settings.html" class="active">Settings</a></li>
      <li><a href="activity.html">Activity Log</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-email" data-user-email>—</div>
      <button class="btn-signout" data-signout>Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1>Settings</h1>
      <p>This is the "company brain" every future AI worker will read from — get it right once.</p>
    </div>

    <div class="panel">
      <form id="settings-form">
        <label for="services">Services offered (one per line)</label>
        <textarea id="services" placeholder="Vessel husbandry
Crew changes
Port agency"></textarea>

        <label for="ports_covered">Ports covered (one per line)</label>
        <textarea id="ports_covered" placeholder="Sohar
Duqm
Salalah"></textarea>

        <label for="approved_claims">Approved claims (things it's okay to say about the company)</label>
        <textarea id="approved_claims"></textarea>

        <label for="forbidden_claims">Forbidden claims (things it must never say)</label>
        <textarea id="forbidden_claims"></textarea>

        <label for="signature">Email signature</label>
        <textarea id="signature"></textarea>

        <label for="daily_max">Daily sending limit (max outreach emails/day)</label>
        <input type="number" id="daily_max" min="0" value="20">

        <div class="error-text" id="settings-error"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="settings-save">Save settings</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, requireAuth, wireSignOut, logActivity } from './js/supabaseClient.js';

  await requireAuth();
  wireSignOut();

  let profileId = null;

  function linesToArray(text) {
    return text.split('\n').map(s => s.trim()).filter(Boolean);
  }

  async function loadProfile() {
    const { data, error } = await supabase.from('company_profile').select('*').limit(1);
    if (error || !data || data.length === 0) return;

    const p = data[0];
    profileId = p.id;
    document.getElementById('services').value = (p.services || []).join('\n');
    document.getElementById('ports_covered').value = (p.ports_covered || []).join('\n');
    document.getElementById('approved_claims').value = (p.approved_claims || []).join('\n');
    document.getElementById('forbidden_claims').value = (p.forbidden_claims || []).join('\n');
    document.getElementById('signature').value = p.signature || '';
    document.getElementById('daily_max').value = (p.sending_limits && p.sending_limits.daily_max) ?? 20;
  }

  document.getElementById('settings-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('settings-error');
    const btn = document.getElementById('settings-save');
    errorBox.textContent = '';
    btn.disabled = true;

    const payload = {
      services: linesToArray(document.getElementById('services').value),
      ports_covered: linesToArray(document.getElementById('ports_covered').value),
      approved_claims: linesToArray(document.getElementById('approved_claims').value),
      forbidden_claims: linesToArray(document.getElementById('forbidden_claims').value),
      signature: document.getElementById('signature').value.trim(),
      sending_limits: { daily_max: parseInt(document.getElementById('daily_max').value || '20', 10) }
    };

    let error;
    if (profileId) {
      ({ error } = await supabase.from('company_profile').update(payload).eq('id', profileId));
    } else {
      const { data, error: insertError } = await supabase.from('company_profile').insert(payload).select().single();
      error = insertError;
      if (data) profileId = data.id;
    }

    btn.disabled = false;
    if (error) { errorBox.textContent = error.message; return; }

    await logActivity('Manual Entry', 'Updated company settings', 'company_profile', profileId, {});
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = 'Save settings'; }, 1800);
  });

  loadProfile();
</script>

</body>
</html>
